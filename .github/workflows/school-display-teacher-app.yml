name: School Display Teacher App
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/school-display/mobile/**'
      - 'projects/school-display/web/teacher*'
      - 'projects/school-display/shared/**'
      - '.github/workflows/school-display-teacher-app.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/school-display/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/school-display/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node scripts/build-www.mjs && npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: school-teacher-app-debug-${{ github.sha }}
          path: projects/school-display/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
