name: Verify STOCRANT
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: public-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: public-website/package-lock.json
      - run: npm ci --include=dev
      - run: npm run build
      - run: npm audit --audit-level=high
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: stocrant-website-${{ github.sha }}
          path: |
            dist/
            package.json
            package-lock.json
          retention-days: 30
  android:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --include=dev
      - name: Build mobile UI from this source commit
        env:
          VITE_API_BASE_URL: ${{ vars.STOCRANT_API_URL }}
        run: |
          node --input-type=module -e 'const value = process.env.VITE_API_BASE_URL; if (value && (new URL(value).protocol !== "https:" || new URL(value).username || new URL(value).password)) throw Error("STOCRANT_API_URL must use HTTPS without credentials");'
          npm run build:frontend
          npx --no-install cap sync android
      - name: Build Android testing package
        env:
          STOCRANT_VERSION_CODE: ${{ github.run_number }}
          STOCRANT_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
      - run: npm run mobile:save
      - uses: actions/upload-artifact@v4
        with:
          name: stocrant-android-debug-${{ github.sha }}
          path: mobile/releases/
          if-no-files-found: error
          retention-days: 30
