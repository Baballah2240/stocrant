<!doctype html>
<meta charset="utf-8">
<title>Compose</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Builds the presentation from the real motion clips recorded by capture.mjs.
const W=1920,H=1080,FPS=30,XF=0.45;
const C={night:'#0a1a22',deep:'#0f2f35',teal:'#0b7a72',mint:'#9fe0cf',sand:'#f1dfbd',maroon:'#8a1538',white:'#ffffff',soft:'#cfe1dd',dim:'#8fb0ab'};
const SANS='"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif',AR='"Segoe UI","Tahoma",sans-serif';
const plan=[
 {type:'title',dur:5.5},
 {clip:'overview',n:'01',chapter:'Control room',head:'The whole school day, live.',cap:[[0,'One clear view of every lesson, teacher and break.','صورة واحدة واضحة لكل حصة ومعلم وفسحة.'],[3.5,'The monitor preview shows exactly what classrooms see right now.','معاينة الشاشة تعرض ما تراه الفصول الآن.']]},
 {clip:'timetable',n:'02',chapter:'Timetable',cap:[[0,'Each class has its own weekly timetable.','لكل فصل جدوله الأسبوعي الخاص.'],[4.5,'The week board shows every lesson. Drag one to move it.','لوحة الأسبوع تعرض كل الحصص، واسحب أي حصة لنقلها.'],[8,"Filter by teacher to see one person's whole week.",'اعرض أسبوع أي معلم بنقرة واحدة.']]},
 {clip:'cover',n:'03',chapter:'Cover an absent teacher',cap:[[0,'A teacher is absent tomorrow. Choose the date and the teacher.','معلم غائب غداً؟ اختر التاريخ والمعلم.'],['tap1+0.6','Free colleagues are suggested for each lesson. The weekly timetable stays unchanged.','يقترح النظام البدلاء المتاحين لكل حصة دون تغيير الجدول الأسبوعي.']]},
 {clip:'notify',n:'04',chapter:'Notifications',cap:[[0,'Write a notification once, in the control room.','اكتب الإشعار مرة واحدة من غرفة التحكم.'],['tap1','Publish it, and it reaches teachers and parents in the app.','انشره ليصل إلى المعلمين وأولياء الأمور في التطبيق.']]},
 {clip:'display',n:'05',chapter:'Classroom display',full:true,cap:[[0,'Every classroom screen shows what is happening now and what comes next.','تعرض شاشة كل فصل ما يحدث الآن وما هو قادم.'],[3.8,'Break time counts down in Arabic and English, with no internet needed.','عدّ تنازلي للفسحة بالعربية والإنجليزية دون الحاجة للإنترنت.']]},
 {clip:'teacher',n:'06',chapter:'Faslii for teachers',phone:true,title:['The school day,','in every pocket.'],cap:[[0,'Teachers sign in to Faslii with their school account.','يسجّل المعلم دخوله إلى فصلي بحساب المدرسة.'],['tap0+1.2','Their next lesson and countdown appear at once.','تظهر حصته القادمة والعدّ التنازلي فوراً.'],['tap1','Notifications from the control room arrive here.','تصل إشعارات غرفة التحكم إلى هنا.'],['tap2','Messages from the school, with replies.','رسائل المدرسة مع إمكانية الرد.']]},
 {clip:'parent',n:'07',chapter:'Faslii for parents',phone:true,title:['Families stay','in the loop.'],cap:[[0,'Parents join with a one-time code from the school.','ينضم ولي الأمر برمز لمرة واحدة من المدرسة.'],['tap1+1',"They see their child's day and attendance,",'يتابع يوم طفله وحضوره،'],['tap2','homework and exams,','والواجبات والاختبارات،'],['tap3','and can request an absence in seconds.','ويطلب الإذن بالغياب خلال ثوانٍ.']]},
 {clip:'arabic',n:'08',chapter:'Arabic and English',cap:[[0,'Every screen works in Arabic and English.','كل الشاشات تعمل بالعربية والإنجليزية.']]},
 {type:'end',dur:7},
];
let clips={},bitmaps=new Map(),icon=null,total=0;
const g=document.getElementById('c').getContext('2d');
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function text(s,x,y,size,color,weight=600,align='left',font=SANS,alpha=1){g.save();g.globalAlpha*=alpha;g.font=`${weight} ${size}px ${font}`;g.fillStyle=color;g.textAlign=align;g.direction=/[؀-ۿ]/.test(s)&&!/[A-Za-z]/.test(s)?'rtl':'ltr';g.fillText(s,x,y);g.restore();}
function backdrop(t){const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,C.night);gr.addColorStop(1,C.deep);g.fillStyle=gr;g.fillRect(0,0,W,H);
 const orb=(x,y,r,col,a)=>{const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(0,0,0,0)');g.globalAlpha=a;g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);g.globalAlpha=1;};
 orb(W*.82+Math.sin(t*.13)*60,H*.18+Math.cos(t*.11)*40,720,C.teal,.38);orb(W*.12+Math.cos(t*.09)*50,H*.92,620,C.maroon,.28);}
// Scene timing
function layout(){let at=0;for(const s of plan){if(s.clip){const c=clips[s.clip];s.dur=c?c.duration/1000+0.6:3;const taps=(c?.pointer||[]).filter(e=>e.kind==='tap').map(e=>e.t/1000+0.3);
  s.cap=s.cap.map(([when,...rest])=>{if(typeof when==='number')return [when,...rest];const m=/^tap(\d+)([+-][\d.]+)?$/.exec(when);const base=taps[Number(m[1])];return [base===undefined?0:base+Number(m[2]||0),...rest];}).sort((a,b)=>a[0]-b[0]);}s.at=at;at+=s.dur;}total=at;}
// Frames: returns two neighbouring frames and the blend between them.
function framePair(c,ms){const f=c.frames;let i=0;while(i<f.length-1&&f[i+1].t<=ms)i++;const j=Math.min(f.length-1,i+1);const span=f[j].t-f[i].t;return [f[i],f[j],span>0?clamp((ms-f[i].t)/span):0];}
function bitmap(name,file){const key=name+'/'+file;const b=bitmaps.get(key);if(b&&b!=='loading')return b;if(!b){bitmaps.set(key,'loading');createImageBitmap(clips[name].blobs[file]).then(x=>bitmaps.set(key,x));}return null;}
function prefetch(name,ms){const c=clips[name];for(const f of c.frames)if(f.t>=ms&&f.t<ms+1500)bitmap(name,f.file);const keep=new Set(Object.values(lastDrawn));for(const [k,v] of bitmaps){if(v==='loading'||keep.has(v))continue;const mine=k.startsWith(name+'/');const f=mine&&c.frames.find(x=>name+'/'+x.file===k);if((mine&&f&&f.t<ms-800)||(!mine&&bitmaps.size>150)){v.close();bitmaps.delete(k);}}}
const lastDrawn={};
function drawClip(name,ms,x,y,w,h){const c=clips[name];prefetch(name,ms);const [a,b,k]=framePair(c,ms);const A=bitmap(name,a.file),B=bitmap(name,b.file);
 const img=A||lastDrawn[name];if(!img)return;g.drawImage(img,x,y,w,h);if(A)lastDrawn[name]=A;if(B&&k>0.05){g.globalAlpha=k;g.drawImage(B,x,y,w,h);g.globalAlpha=1;}}
function drawPointer(name,ms,ox,oy,scale){const c=clips[name];const ev=c.pointer||[];const moves=ev.filter(e=>e.kind==='move'&&e.t<=ms);if(!moves.length)return;const cur=moves[moves.length-1],prev=moves[moves.length-2]||cur;const k=ease(clamp((ms-cur.t)/700));const x=ox+(prev.x+(cur.x-prev.x)*k)*scale,y=oy+(prev.y+(cur.y-prev.y)*k)*scale;const fade=clamp((ms-moves[0].t)/300);const tap=[...ev].reverse().find(e=>e.kind==='tap'&&e.t<=ms);g.save();g.globalAlpha=fade;if(tap&&ms-tap.t<520){const q=(ms-tap.t)/520;g.strokeStyle=`rgba(159,224,207,${1-q})`;g.lineWidth=4;g.beginPath();g.arc(x,y,16+q*34,0,7);g.stroke();}g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=14;g.shadowOffsetY=4;g.fillStyle='rgba(11,122,114,.35)';g.beginPath();g.arc(x,y,17,0,7);g.fill();g.shadowColor='transparent';g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=3;g.stroke();g.restore();}
function windowFrame(s,ms,p){const w=1500,h=844,x=(W-w)/2,y=40+(1-ease(clamp(p*4)))*24;
 g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=70;g.shadowOffsetY=24;g.fillStyle='#e9eef0';rr(x,y,w,h+40,18);g.fill();g.restore();
 g.fillStyle='#e9eef0';rr(x,y,w,40,18);g.fill();['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(x+26+i*22,y+20,7,0,7);g.fill();});
 g.fillStyle='#fff';rr(x+w/2-260,y+8,520,24,12);g.fill();text('school.local/control',x+w/2,y+26,15,'#5a6b70',500,'center');
 g.save();rr(x,y+40,w,h,0);g.clip();drawClip(s.clip,ms,x,y+40,w,h);drawPointer(s.clip,ms,x,y+40,w/1600);g.restore();}
function phoneFrame(s,ms,p,t){const ph=860,pw=ph*390/844,x=W-pw-250,y=(H-ph)/2-50+(1-ease(clamp(p*4)))*40;
 g.save();g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=90;g.shadowOffsetY=30;g.fillStyle='#04080b';rr(x-20,y-20,pw+40,ph+40,64);g.fill();g.restore();
 g.save();rr(x,y,pw,ph,46);g.clip();drawClip(s.clip,ms,x,y,pw,ph);drawPointer(s.clip,ms,x,y,pw/390);g.restore();
 const a=ease(clamp(p*5));text('Faslii · فصلي',190,230,34,C.sand,700,'left',SANS,a);s.title.forEach((l,i)=>text(l,190,340+i*100,88,C.white,800,'left',SANS,a));}
function fullFrame(s,ms,p){const z=1.06-0.06*ease(p);const w=W*z,h=H*z;drawClip(s.clip,ms,(W-w)/2,(H-h)/2,w,h);}
function caption(s,local){const cap=[...s.cap].reverse().find(c=>local>=c[0]);if(!cap)return;const since=local-cap[0],next=s.cap.find(c=>c[0]>cap[0]),until=(next?next[0]:s.dur)-local;
 const a=clamp(Math.min(since/0.35,until/0.3,1));const lift=(1-ease(clamp(since/0.4)))*12;
 const y=H-128;const gr=g.createLinearGradient(0,y-90,0,H);gr.addColorStop(0,'rgba(4,14,18,0)');gr.addColorStop(.45,'rgba(4,14,18,.82)');gr.addColorStop(1,'rgba(4,14,18,.95)');g.fillStyle=gr;g.fillRect(0,y-90,W,H-y+90);
 g.fillStyle=C.sand;rr(150,y-4,6,92,3);g.fill();
 text(`${s.n}  ${s.chapter.toUpperCase()}`,178,y+14,20,C.sand,700);
 text(cap[1],178,y+56+lift,38,C.white,600,'left',SANS,a);text(cap[2],178,y+98+lift,29,C.soft,500,'left',AR,a);}
function titleCard(t,end){backdrop(t);const a=ease(clamp(t/1.2));
 if(icon){const iy=end?220:200;g.save();g.globalAlpha=a;rr(W/2-64,iy,128,128,30);g.clip();g.drawImage(icon,W/2-64,iy,128,128);g.restore();}
 if(!end){text('Qatar School Time Table  +  Faslii',W/2,410,34,C.sand,600,'center',SANS,a);
  text('Every lesson. Every screen. On time.',W/2,530,86,C.white,800,'center',SANS,ease(clamp((t-.3)/1.2)));
  text('كل حصة، على كل شاشة، في وقتها.',W/2,630,54,C.soft,600,'center',AR,ease(clamp((t-.6)/1.2)));
  const items=['Control room','Classroom display','Teacher app','Parent app'];items.forEach((s,i)=>text(s,W/2+(i-1.5)*330,770,28,C.mint,600,'center',SANS,ease(clamp((t-1.2-i*.15)/.8))));}
 else{text('One timetable.',W/2,450,84,C.white,800,'center',SANS,a);text('Every classroom. Every family.',W/2,550,84,C.white,800,'center',SANS,ease(clamp((t-.4)/1.2)));
  text('جدول واحد لكل فصل ولكل أسرة.',W/2,650,52,C.soft,600,'center',AR,ease(clamp((t-.8)/1.2)));
  text('Qatar School Time Table  +  Faslii · فصلي',W/2,790,34,C.sand,600,'center',SANS,ease(clamp((t-1.4)/1)));}}
function chapterBadge(s,local){if(s.phone||local>2.2)return;const a=clamp(Math.min(local/0.4,(2.2-local)/0.5));g.save();g.globalAlpha=a;g.fillStyle='rgba(4,14,18,.78)';rr(s.full?60:230,s.full?50:96,360,64,32);g.fill();
 text(s.n,(s.full?60:230)+34,(s.full?50:96)+43,26,C.sand,800);text(s.chapter,(s.full?60:230)+84,(s.full?50:96)+42,26,C.white,600);g.restore();}
function draw(t){for(const s of plan){if(t>=s.at&&t<s.at+s.dur||s===plan[plan.length-1]){const local=t-s.at,p=clamp(local/s.dur);
  if(s.type==='title')titleCard(local,false);else if(s.type==='end')titleCard(local,true);
  else{backdrop(t);const ms=Math.max(0,(local-0.3)*1000);if(s.full)fullFrame(s,ms,p);else if(s.phone)phoneFrame(s,ms,p,t);else windowFrame(s,ms,p);chapterBadge(s,local);caption(s,local);}
  const fin=clamp(local/XF),fout=clamp((s.at+s.dur-t)/XF);const dark=1-Math.min(fin,s===plan[plan.length-1]?1:fout);if(dark>0){g.fillStyle=`rgba(4,12,16,${dark})`;g.fillRect(0,0,W,H);}
  g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,H-5,W,5);g.fillStyle=C.sand;g.fillRect(0,H-5,W*clamp(t/total),5);return;}}}
async function prep(){const meta=await (await fetch('clips.json')).json();
 for(const c of meta.clips){c.blobs={};await Promise.all(c.frames.map(async f=>{c.blobs[f.file]=await (await fetch('clips/'+c.name+'/'+f.file)).blob();}));clips[c.name]=c;}
 try{icon=await createImageBitmap(await (await fetch('/icon.png')).blob());}catch{}
 layout();for(const s of plan)if(s.clip&&clips[s.clip])bitmap(s.clip,clips[s.clip].frames[0].file);await new Promise(r=>setTimeout(r,800));return {total};}
window.prep=prep;window.preview=t=>draw(t);
window.record=async()=>{await prep();const canvas=document.getElementById('c');const stream=canvas.captureStream(FPS);const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:14e6});const chunks=[];
 rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(r=>rec.onstop=r);draw(0);rec.start(1000);const start=performance.now();
 await new Promise(resolve=>{const id=setInterval(()=>{const t=(performance.now()-start)/1000;if(t>=total){clearInterval(id);draw(total-0.001);resolve();return;}draw(t);},1000/FPS);});
 rec.stop();await done;const blob=new Blob(chunks,{type:'video/webm'});await fetch('/save',{method:'POST',body:blob});return {size:blob.size,seconds:total};};
</script>
