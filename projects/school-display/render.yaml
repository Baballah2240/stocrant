# Independent single-school service. Do not replace the Stocrant root blueprint.
services:
  - type: web
    name: school-display
    runtime: node
    plan: starter
    region: ohio
    rootDir: projects/school-display
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: "off"
    numInstances: 1
    domains:
      - schools.mohbaba.online
    disk:
      name: school-display-data
      mountPath: /var/lib/school-display
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: SCHOOL_DATA_DIR
        value: /var/lib/school-display
      - key: SCHOOL_NETWORK_ORIGIN
        value: https://schools.mohbaba.online
      - key: SCHOOL_TRUST_PROXY
        value: "1"
      - key: SCHOOL_SETUP_KEY
        generateValue: true
