<!doctype html>
<html><head><meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"/>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  img{position:fixed;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(22px) saturate(1.15) brightness(.9);opacity:0;transform:scale(1.015);transition:opacity .26s ease,transform .32s cubic-bezier(.22,1,.36,1)}
  img.on{opacity:1;transform:scale(1)}
  img.instant{transition:none}
</style></head>
<body><img alt=""/>
<script>
  const img = document.querySelector("img");
  window.showBlur = (url, instant) => new Promise(resolve => {
    img.classList.toggle("instant", instant); img.classList.remove("on");
    img.onload = () => { requestAnimationFrame(() => { img.classList.add("on"); resolve(true); }); };
    img.src = url;
  });
  window.hideBlur = instant => { img.classList.toggle("instant", instant); img.classList.remove("on"); return instant ? 0 : 280; };
</script></body></html>
